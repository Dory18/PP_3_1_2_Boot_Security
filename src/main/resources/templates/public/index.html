<!DOCTYPE html>
<html lang="en"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <title>Kata Spring App</title>
    <link th:href="@{/css/user_page/index.css}" rel="stylesheet">
</head>
<body>
<div class="main-wrapper">
    <div class="left">
        <h2 class="margin_top">Быстрый старт</h2>
        <p>Для просмотра пользователей пройдите авторизацию</p>
        <div sec:authorize="isAuthenticated()" class="btn-center-container">
            <button class="my-custom-btn">
                <a href="/user">Пользователь</a>
            </button>
        </div>
        <div sec:authorize="isAuthenticated()" class="btn-center-container">
            <button class="my-custom-btn">
                <a th:href="@{/logout}">Выйти</a>
            </button>
        </div>
        <div sec:authorize="!isAuthenticated()" class="btn-center-container">
            <button class="my-custom-btn">
                <a href="/login">Войти</a>
            </button>
        </div>
    </div>
</div>
</body>
</html>
