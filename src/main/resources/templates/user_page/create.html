<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Добавление пользователя</title>
    <link th:href="@{/css/user_page/create.css}" rel="stylesheet">
</head>
<body>

<div class="main-wrapper">
    <div class="content-block">

        <h3>Новый пользователь</h3>

        <div class="form-card">
            <form th:method="POST" th:action="@{/admin/users}" th:object="${user}">

                <div class="form-group">
                    <label for="lastName" class="form-label">Фамилия</label>
                    <input th:field="*{lastName}" type="text" id="lastName" class="form-input"
                           placeholder="Введите фамилию"/>
                    <div class="error-message" th:if="${#fields.hasErrors('lastName')}" th:errors="*{lastName}"></div>
                </div>

                <div class="form-group">
                    <label for="firstName" class="form-label">Имя</label>
                    <input th:field="*{firstName}" type="text" id="firstName" class="form-input"
                           placeholder="Введите имя"/>
                    <div class="error-message" th:if="${#fields.hasErrors('firstName')}" th:errors="*{firstName}"></div>
                </div>

                <div class="form-group">
                    <label for="middleName" class="form-label">Отчество</label>
                    <input th:field="*{middleName}" type="text" id="middleName" class="form-input"
                           placeholder="Введите отчество"/>
                    <div class="error-message" th:if="${#fields.hasErrors('middleName')}"
                         th:errors="*{middleName}"></div>
                </div>

                <div class="form-group">
                    <label for="age" class="form-label">Возраст</label>
                    <input th:field="*{age}" type="text" id="age" class="form-input" placeholder="Укажите возраст"/>
                    <div class="error-message" th:if="${#fields.hasErrors('age')}" th:errors="*{age}"></div>
                </div>
                <div class="form-group">
                    <label for="username" class="form-label">Логин</label>
                    <input th:field="*{username}" type="text" id="username" class="form-input" placeholder="Укажите логин"/>
                    <div class="error-message" th:if="${#fields.hasErrors('username')}" th:errors="*{username}"></div>
                    <div class="error-message" th:if="${usernameError}" th:text="${usernameError}"></div>
                </div>
                <div class="form-group">
                    <label for="password" class="form-label">Пароль</label>
                    <input th:field="*{password}" type="text" id="password" class="form-input" placeholder="Укажите пароль"/>
                    <div class="error-message" th:if="${#fields.hasErrors('password')}" th:errors="*{password}"></div>
                </div>
                <div class="form-group">
                    <label class="form-label">Роли (По умолчанию выбрана роль "Пользователь")</label>
                    <div class="custom-multiselect">
                        <div class="select-box form-input" id="selectBox">
                            <span class="placeholder-text" id="selectedContainer">Кликните, чтобы выбрать роли...</span>
                            <div class="arrow"></div>
                        </div>

                        <div class="dropdown-options" id="dropdownOptions">
                            <div class="option-item" th:each="role : ${allRoles}">
                                <input type="checkbox"
                                       th:id="'role_' + ${role.id}"
                                       th:value="${role.id}"
                                       th:text="${role.label}"/>
                            </div>
                        </div>
                    </div>

                    <select th:field="*{roles}" id="realSelect" multiple="multiple" style="display: none;">
                        <option th:each="role : ${allRoles}"
                                th:value="${role.id}"
                                th:text="${role.label}"></option>
                    </select>

                    <div th:if="${#fields.hasErrors('roles')}" th:errors="*{roles}" class="error-message"></div>
                </div>

                <input type="submit" value="Добавить" class="my-custom-btn btn-submit">
            </form>
        </div>

        <div class="btn-center-container">
            <button class="my-custom-btn">
                <a href="/admin/users/">Назад к списку</a>
            </button>
        </div>

    </div>
</div>

<script>
    const multiselectContainer = document.querySelector('.custom-multiselect');
    const selectBox = document.getElementById('selectBox');
    const dropdownOptions = document.getElementById('dropdownOptions');
    const selectedContainer = document.getElementById('selectedContainer');
    const realSelect = document.getElementById('realSelect');

    // 1. Открытие и закрытие списка при клике на поле
    selectBox.addEventListener('click', (e) => {
        multiselectContainer.classList.toggle('open');
        e.stopPropagation();
    });

    // 2. Закрытие списка, если кликнули в любое другое место экрана
    document.addEventListener('click', (e) => {
        if (!multiselectContainer.contains(e.target)) {
            multiselectContainer.classList.remove('open');
        }
    });

    // 3. Логика выбора элементов
    const checkboxes = dropdownOptions.querySelectorAll('input[type="checkbox"]');

    checkboxes.forEach(checkbox => {
        checkbox.addEventListener('change', updateSelection);
    });

    function updateSelection() {
        const selectedTexts = [];
        const selectedValues = [];

        checkboxes.forEach(checkbox => {
            if (checkbox.checked) {
                // Извлекаем чистый текст роли (удаляя пробелы)
                selectedTexts.push(checkbox.nextSibling.textContent.trim());
                selectedValues.push(checkbox.value);
            }
        });

        // Обновляем текст в основном поле (создаем "чипсы")
        if (selectedTexts.length > 0) {
            selectedContainer.innerHTML = selectedTexts
                .map(text => `<span class="selected-tag">${text}</span>`)
                .join('');
        } else {
            selectedContainer.innerHTML = '<span class="placeholder-text" style="color: #9ca3af;">Кликните, чтобы выбрать роли...</span>';
        }

        // Синхронизируем состояние с настоящим скрытым <select> для Spring
        Array.from(realSelect.options).forEach(option => {
            option.selected = selectedValues.includes(option.value);
        });
    }
</script>
</body>
</html>
