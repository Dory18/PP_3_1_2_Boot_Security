<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <title>Пользователь</title>
    <link th:href="@{/css/user_page/user.css}" rel="stylesheet">
</head>
<body>

<div class="main-wrapper">
    <div class="content-block">

        <h3>Пользователь</h3>

        <div th:if="${user != null}" style="width: 100%;">

            <div class="user-card">
                <div class="info-row">
                    <span class="info-label">ИД</span>
                    <span class="info-value" th:text="${user.id}"></span>
                </div>
                <div class="info-row">
                    <span class="info-label">Фамилия</span>
                    <span class="info-value" th:text="${user.lastName}"></span>
                </div>
                <div class="info-row">
                    <span class="info-label">Имя</span>
                    <span class="info-value" th:text="${user.firstName}"></span>
                </div>
                <div class="info-row">
                    <span class="info-label">Отчество</span>
                    <span class="info-value" th:text="${user.middleName}"></span>
                </div>
                <div class="info-row">
                    <span class="info-label">Возраст</span>
                    <span class="info-value" th:text="${user.age}"></span>
                </div>
            </div>

            <div sec:authorize="hasRole('ROLE_ADMIN')" class="actions-block">
                <button class="my-custom-btn btn-milky">
                    <a th:href="@{/admin/users/edit(id=${user.id})}">Редактировать</a>
                </button>

                <form th:if="${user.id != #authentication.principal.id}"
                      th:method="DELETE"
                      th:action="@{/admin/users/delete(id=${user.id})}"
                      class="inline-form">
                    <input type="submit" value="Удалить" class="my-custom-btn btn-danger"/>
                </form>
            </div>

        </div>

        <div th:if="${user == null}">
            <p class="error-message">Пользователь не найден.</p>
        </div>

        <button sec:authorize="hasRole('ROLE_ADMIN')" class="my-custom-btn btn-milky" style="margin-top: 10px;">
            <a href="/admin/users/">Пользователи</a>
        </button>
        <button sec:authorize="hasRole('ROLE_USER')" class="my-custom-btn btn-milky" style="margin-top: 10px;">
            <a href="/">Главная страница</a>
        </button>

    </div>
</div>

</body>
</html>
